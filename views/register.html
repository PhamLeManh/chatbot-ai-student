<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản Phi Hành Gia Sinh Viên - AI Student Cosmos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>

  <!-- CANVAS NỀN VŨ TRỤ -->
  <canvas id="cosmic-canvas"></canvas>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">
        <i class="fas fa-meteor"></i>
      </div>
      <span>AI Student <span style="color: var(--cosmic-cyan-glow);">Cosmos</span></span>
    </a>

    <div class="nav-actions">
      <button class="btn btn-icon theme-toggle-btn" title="Chuyển đổi giao diện Không gian / Cực quang">
        <i class="fas fa-sun"></i>
      </button>
      <a href="/login" class="btn btn-secondary btn-sm"><i class="fas fa-right-to-bracket"></i> Đã có tài khoản? Đăng Nhập</a>
    </div>
  </nav>

  <!-- AUTH WRAPPER -->
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 550px;">
      <div class="auth-header">
        <div class="auth-brand-icon">
          <i class="fas fa-user-plus"></i>
        </div>
        <h2 class="auth-title">Đăng Ký Tài Khoản</h2>
        <p class="auth-subtitle">Tạo tài khoản phi hành gia học tập cá nhân hóa miễn phí cùng AI</p>
      </div>

      <!-- 1-Click Demo Quick Note -->
      <div class="demo-accounts-box">
        <div class="demo-title">
          <i class="fas fa-circle-info"></i> Bạn muốn trải nghiệm nhanh không cần điền thông tin?
        </div>
        <button type="button" class="btn btn-secondary btn-sm" style="width: 100%;" onclick="quickDemoLogin('student')">
          <i class="fas fa-bolt" style="color: var(--cosmic-cyan-glow);"></i> Nhấn Vào Đây Để Đăng Nhập Demo Ngay
        </button>
      </div>

      <!-- Register Form -->
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Họ và Tên <span style="color: var(--accent);">*</span></label>
          <div class="input-with-icon">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="name" class="form-control" placeholder="Nguyễn Văn A" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Địa Chỉ Email <span style="color: var(--accent);">*</span></label>
          <div class="input-with-icon">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-control" placeholder="sinhvien@daihoc.edu.vn" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="studentId">Mã Số Sinh Viên (MSSV)</label>
            <div class="input-with-icon">
              <i class="fas fa-id-card input-icon"></i>
              <input type="text" id="studentId" class="form-control" placeholder="20261234">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="major">Chuyên Ngành Học</label>
            <div class="input-with-icon">
              <i class="fas fa-laptop-code input-icon"></i>
              <input type="text" id="major" class="form-control" placeholder="Công nghệ thông tin / AI">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="university">Trường Đại Học / Viện Đào Tạo</label>
          <div class="input-with-icon">
            <i class="fas fa-building-columns input-icon"></i>
            <input type="text" id="university" class="form-control" placeholder="ĐH Bách Khoa / ĐH Quốc Gia">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="password">Mật Khẩu <span style="color: var(--accent);">*</span></label>
            <div class="input-with-icon">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
              <span class="password-toggle"><i class="fas fa-eye"></i></span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Nhập Lại Mật Khẩu <span style="color: var(--accent);">*</span></label>
            <div class="input-with-icon">
              <i class="fas fa-shield-halved input-icon"></i>
              <input type="password" id="confirmPassword" class="form-control" placeholder="Khớp mật khẩu trên" minlength="6" required>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1.05rem; margin-top: 0.5rem;">
          Tạo Tài Khoản Vũ Trụ <i class="fas fa-user-plus"></i>
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="/login">Đăng nhập tại đây</a>
      </div>
    </div>
  </div>

  <script src="/js/cosmic-stars.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
